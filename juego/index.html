<title>¡Sale pedido! · el juego de la bodega</title>

<style>
@font-face { font-family: "Hombros"; src: url("fonts/BigShoulders-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
@font-face { font-family: "JBMono"; src: url("fonts/JetBrainsMono-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
:root {
  --navy: #0e1a36; --navy2: #182a55; --navy3: #24396e; --naranja: #ff7a1a; --naranja2: #d95c00; --rojo: #e5412d; --verde: #1fa67a; --amar: #f2b632;
  --fondo: #eef1f6; --tinta: #0e1a36; --gris: #6b7690; --linea: #dfe4ee; --papel: #fffaf0;
  --mono: "JBMono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  --disp: "Hombros", "Arial Narrow", Impact, sans-serif; --papel: #f6ecd6; --amarillo: #ffd21f; --azul: #2f6fde;
  --trazo: -2px -2px 0 #0e1a36, 2px -2px 0 #0e1a36, -2px 2px 0 #0e1a36, 2px 2px 0 #0e1a36, 0 -3px 0 #0e1a36, 0 3px 0 #0e1a36, -3px 0 0 #0e1a36, 3px 0 0 #0e1a36, 0 7px 0 #0e1a36, 2px 7px 0 #0e1a36, -2px 7px 0 #0e1a36;
  --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
* { box-sizing: border-box; margin: 0; -webkit-tap-highlight-color: transparent; }
[hidden] { display: none !important; }
html, body { height: 100%; overflow: hidden; overscroll-behavior: none; background: #070d1f; }
body { font-family: var(--sans); color: var(--tinta); -webkit-user-select: none; user-select: none; -webkit-touch-callout: none; touch-action: manipulation; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; border: 0; background: none; cursor: pointer; touch-action: manipulation; }
#app { position: fixed; inset: 0; max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; overflow: hidden;
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
  background: radial-gradient(90% 45% at 85% 0%, #2a418a 0%, transparent 70%), radial-gradient(80% 40% at 0% 100%, #3a1f5c 0%, transparent 70%), var(--navy); }
#app::before { content: ""; position: absolute; inset: -40px; pointer-events: none; opacity: .5;
  background-image: radial-gradient(rgba(255,255,255,.09) 1.2px, transparent 1.6px); background-size: 22px 22px; animation: deriva 14s linear infinite; }
@keyframes deriva { to { transform: translate(22px, 22px); } }
.pant { position: relative; flex: 1; min-height: 0; display: flex; flex-direction: column; animation: entra-p .35s ease-out; }
@keyframes entra-p { from { opacity: 0; transform: translateY(10px); } }

/* botones: cartel pintado con borde grueso */
.btn { position: relative; display: block; width: 100%; padding: 13px 14px 11px; border-radius: 14px; background: var(--naranja); color: #fff;
  font: 700 23px/1 var(--disp); letter-spacing: .05em; text-transform: uppercase; border: 3px solid var(--tinta); box-shadow: 0 5px 0 var(--tinta); transition: transform .08s, box-shadow .08s; }
.btn:active { transform: translateY(4px); box-shadow: 0 1px 0 var(--tinta); }
.btn.sec { background: var(--papel); color: var(--tinta); }
.btn.verde { background: var(--verde); }
@keyframes late { 50% { opacity: .35; } }
@keyframes logo { from { transform: rotate(-12deg) scale(.3); opacity: 0; } }
@keyframes regalo { 0%, 70%, 100% { transform: rotate(0); } 76% { transform: rotate(-12deg) scale(1.08); } 84% { transform: rotate(10deg) scale(1.08); } 92% { transform: rotate(-6deg); } }
@keyframes brillo { 0%, 55% { left: -90px; } 100% { left: 110%; } }
@keyframes sube-n { from { transform: translateY(24px); opacity: 0; } }

/* ---------- Intro: recorrido 3D por la bodega ---------- */
#intro { position: absolute; inset: 0; z-index: 30; overflow: hidden; color: #fff; background: #c6d8b8; }
#intro.fuera { animation: fuera .45s forwards; }
@keyframes fuera { to { opacity: 0; transform: scale(1.05); } }
#iVideo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: 26% 42%; background: #c6d8b8 center / cover no-repeat; }
#intro .velo { position: absolute; left: 0; right: 0; bottom: 0; height: 46%; background: linear-gradient(rgba(14,26,54,0), rgba(14,26,54,.78) 62%, rgba(14,26,54,.94)); pointer-events: none; }
#saltar { position: absolute; right: 12px; top: calc(10px + env(safe-area-inset-top)); z-index: 2; font: 700 15px/1 var(--disp); letter-spacing: .1em; text-transform: uppercase; color: var(--tinta);
  background: rgba(246,236,214,.92); border: 2.5px solid var(--tinta); border-radius: 20px; padding: 8px 12px 6px; box-shadow: 0 3px 0 var(--tinta); }
.isub { position: absolute; left: 18px; right: 18px; bottom: calc(96px + env(safe-area-inset-bottom)); }
.isub small { display: block; font: 700 15px/1 var(--disp); letter-spacing: .14em; text-transform: uppercase; color: var(--amarillo); min-height: 15px; }
.isub p { font: 700 32px/1.06 var(--disp); text-transform: uppercase; letter-spacing: .02em; margin-top: 7px; text-shadow: 0 3px 0 rgba(0,0,0,.45); }
.isub.cambia small, .isub.cambia p { animation: isub .4s cubic-bezier(.2,1.2,.4,1) both; }
.isub.cambia p { animation-delay: .07s; }
@keyframes isub { from { opacity: 0; transform: translateY(16px); } }
.ipie { position: absolute; left: 18px; right: 18px; bottom: calc(22px + env(safe-area-inset-bottom)); height: 58px; display: flex; align-items: center; }
.ibarra { flex: 1; height: 6px; border-radius: 3px; background: rgba(255,255,255,.25); overflow: hidden; }
.ibarra i { display: block; height: 100%; width: 100%; background: var(--naranja); transform-origin: 0 50%; transform: scaleX(0); }
#iSig { position: absolute; inset: 0 0 auto 0; animation: a-pop .5s cubic-bezier(.3,1.7,.5,1) both; }
@media (max-height: 640px) { .isub p { font-size: 25px; } .isub { bottom: calc(86px + env(safe-area-inset-bottom)); } }
/* piezas animadas de las escenas */
.a-sol { animation: a-sol 2.6s ease-out both; } @keyframes a-sol { from { transform: translateY(46px); } }
.a-camion { animation: a-camion 1.5s cubic-bezier(.2,.9,.3,1) .3s both; } @keyframes a-camion { from { transform: translateX(-240px); } 80% { transform: translateX(5px); } }
.a-rebota { animation: a-rebota .9s ease-in-out infinite; transform-box: fill-box; transform-origin: 50% 100%; }
@keyframes a-rebota { 0%, 100% { transform: translateY(0) scale(1.04, .96); } 50% { transform: translateY(-9px) scale(.97, 1.03); } }
.a-cae { animation: a-cae .7s cubic-bezier(.3,1.5,.5,1) both; } @keyframes a-cae { from { transform: translateY(-190px) rotate(-25deg); opacity: 0; } }
.a-tiembla { animation: a-tiembla .14s linear infinite; } @keyframes a-tiembla { 50% { transform: translate(1.5px, -1px) rotate(1.5deg); } }
.a-pop { animation: a-pop .5s cubic-bezier(.3,1.7,.5,1) both; transform-box: fill-box; transform-origin: center; } @keyframes a-pop { from { transform: scale(0); } }
.a-viaje { animation: a-viaje 3.2s ease-in-out infinite; } @keyframes a-viaje { 0%, 8% { transform: translateX(0); } 92%, 100% { transform: translateX(236px); } }
.a-brilla { animation: a-brilla 1.1s ease-in-out infinite; transform-box: fill-box; transform-origin: center; } @keyframes a-brilla { 50% { transform: scale(.4) rotate(40deg); opacity: .3; } }
.a-humo { animation: a-humo 1s linear infinite; } @keyframes a-humo { from { transform: translate(0, 0); opacity: .7; } to { transform: translate(-16px, -12px); opacity: 0; } }
.a-gota { animation: a-gota 1s ease-in infinite; } @keyframes a-gota { from { transform: translateY(-4px); opacity: 1; } to { transform: translateY(12px); opacity: 0; } }

/* ---------- Menú: el camión de la paquetería ---------- */
#menu { background: linear-gradient(#49a9ea 0%, #9ed8ff 55%, #d8f0ff 100%); overflow-y: auto; overflow-x: hidden; -webkit-overflow-scrolling: touch; padding: 10px 12px 0; }
.cielo { position: absolute; left: 0; right: 0; top: 0; height: 260px; pointer-events: none; overflow: hidden; }
.nube { position: absolute; left: 0; height: 26px; border-radius: 20px; background: #fff; opacity: .9; animation: nube linear infinite; }
.nube::before { content: ""; position: absolute; left: 20%; top: -12px; width: 42%; height: 28px; border-radius: 20px; background: #fff; }
.n1 { top: 22px; width: 90px; animation-duration: 38s; } .n2 { top: 96px; width: 60px; animation-duration: 55s; animation-delay: -20s; opacity: .7; } .n3 { top: 170px; width: 110px; animation-duration: 70s; animation-delay: -45s; opacity: .6; }
@keyframes nube { from { transform: translateX(-140px); } to { transform: translateX(620px); } }
.camionM { position: relative; flex: none; margin-top: 4px; background: linear-gradient(#ff9a3c, #f47c1c); border: 4px solid var(--tinta); border-radius: 30px 30px 14px 14px; padding: 10px 12px 18px;
  box-shadow: inset 0 6px 0 rgba(255,255,255,.3), inset 0 -8px 0 rgba(0,0,0,.14); animation: entra-c .6s cubic-bezier(.2,1.1,.4,1); }
@keyframes entra-c { from { transform: translateX(-110%); } }
.rotulo { text-align: center; padding: 2px 0 6px; }
.rotulo small { display: inline-block; font: 700 13px/1 var(--disp); letter-spacing: .14em; text-transform: uppercase; color: var(--tinta); background: #ffd89a; padding: 4px 10px 3px; border-radius: 8px; border: 2.5px solid var(--tinta); }
.rotulo h1 { font: 700 clamp(46px, 15.5vw, 64px)/.95 var(--disp); text-transform: uppercase; letter-spacing: .01em; color: #fff; text-shadow: var(--trazo); transform: rotate(-2deg); margin-top: 8px; animation: logo .7s cubic-bezier(.3,1.6,.5,1) .3s both; }
.rotulo h1 em { font-style: normal; color: var(--amarillo); }
.ventana { position: relative; margin-top: 26px; background: linear-gradient(#1c2f5e, #0e1a36); border: 4px solid var(--tinta); border-radius: 16px; box-shadow: 0 4px 0 rgba(255,255,255,.3); }
#heroe { padding-top: 16px; }
#heroe svg { display: block; width: 100%; height: auto; border-radius: 0 0 12px 12px; }
.tabs { position: absolute; left: 10px; right: 10px; top: -17px; display: flex; gap: 8px; z-index: 2; }
.tab { flex: 1; font: 700 19px/1 var(--disp); letter-spacing: .06em; text-transform: uppercase; color: #fff; background: var(--azul); border: 3px solid var(--tinta); border-radius: 5px; padding: 8px 4px 6px; box-shadow: 0 4px 0 var(--tinta); transform: rotate(1.5deg); }
.tab:nth-child(3) { transform: rotate(-1deg); }
.tab.prin { flex: 1.5; background: var(--naranja); font-size: 22px; transform: rotate(-2deg); animation: llama 1.1s ease-in-out infinite; }
@keyframes llama { 50% { transform: rotate(-2deg) scale(1.07); } }
.tab:active { transform: translateY(3px); box-shadow: 0 1px 0 var(--tinta); animation: none; }
.banderines { display: block; width: 100%; height: 30px; margin: 4px 0 -4px; }
.hoja { position: relative; margin-top: 12px; background: var(--papel); border: 3px solid var(--tinta); border-radius: 6px; padding: 14px 10px 8px; box-shadow: 0 5px 0 rgba(0,0,0,.3); transform: rotate(-.6deg); color: var(--tinta); }
.hoja::before { content: ""; position: absolute; top: -13px; left: 50%; width: 76px; height: 21px; margin-left: -38px; border-radius: 6px; background: linear-gradient(#e7ecf5, #8e9ab3); border: 3px solid var(--tinta); }
.hoja-cab { display: flex; align-items: center; gap: 8px; background: var(--tinta); color: var(--papel); padding: 6px 8px 4px 10px; font: 700 21px/1 var(--disp); letter-spacing: .07em; text-transform: uppercase; }
.hoja-cab b { flex: 1; }
.hoja-cab span { font-size: 13px; width: 40px; text-align: center; opacity: .75; }
.fila { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 44px; padding: 4px 6px; text-align: left; border-bottom: 1.5px dashed rgba(14,26,54,.22); font: 700 21px/1 var(--disp); letter-spacing: .03em; color: var(--tinta);
  animation: sube-n .4s cubic-bezier(.2,1.2,.4,1) backwards; }
.fila:nth-child(2) { animation-delay: .06s; } .fila:nth-child(3) { animation-delay: .12s; } .fila:nth-child(4) { animation-delay: .18s; } .fila:nth-child(5) { animation-delay: .24s; }
.fila .chk { flex: none; width: 23px; height: 23px; border: 2.5px solid var(--tinta); border-radius: 4px; display: grid; place-items: center; font: 700 22px/1 var(--sans); color: var(--rojo); background: #fff; }
.fila .nom { white-space: nowrap; font-size: clamp(17px, 5.4vw, 21px); }
.fila .guia { flex: 1; min-width: 8px; height: 3px; border-bottom: 3px dotted rgba(14,26,54,.45); transform: translateY(4px); }
.fila .nota { width: 40px; text-align: center; font-size: 26px; }
.nota.n3 { color: var(--verde); } .nota.n2 { color: var(--naranja2); } .nota.n1 { color: #8a7f68; } .nota.n0 { color: #b8ad95; }
.fila .p { width: 40px; text-align: right; font: 700 13px var(--mono); }
.fila .ir { flex: none; font-size: 18px; color: #8a7f68; min-width: 26px; text-align: right; white-space: nowrap; }
.fila .ir svg { width: 20px; height: 20px; vertical-align: -4px; }
.fila.sig { background: linear-gradient(transparent 14%, #ffe14d 14% 86%, transparent 86%); }
.fila.sig .ir { color: var(--rojo); animation: late .9s steps(1) infinite; }
.fila.cerrado { color: #a59c88; }
.fila.cerrado .chk { border-color: #a59c88; background: transparent; }
.fila.cerrado .guia { opacity: .4; }
.fila:active { background: rgba(14,26,54,.1); }
.hoja-pie { font: italic 12px Georgia, "Times New Roman", serif; color: #7a705c; text-align: center; padding-top: 7px; }
.pizarra { position: relative; display: flex; gap: 12px; align-items: center; width: 100%; margin-top: 16px; padding: 11px 14px; text-align: left; background: #27323b; border: 6px solid #b5522a; border-radius: 10px;
  outline: 3px solid var(--tinta); box-shadow: 0 5px 0 rgba(0,0,0,.3); color: #f4f1e6; transform: rotate(.8deg); transition: transform .08s; }
.pizarra:active { transform: rotate(.8deg) translateY(3px); }
.pizarra svg { flex: none; width: 44px; height: 44px; animation: regalo 2.4s ease-in-out infinite; }
.pizarra b { display: block; font: 700 23px/1 var(--disp); text-transform: uppercase; letter-spacing: .06em; color: var(--amarillo); }
.pizarra span span { display: block; font-size: 12.5px; line-height: 1.3; margin-top: 3px; opacity: .9; }
.pizarra::after { content: "!"; position: absolute; top: -17px; right: -8px; width: 34px; height: 34px; border-radius: 50%; background: var(--rojo); border: 3px solid var(--tinta); color: #fff; font: 700 24px/30px var(--disp); text-align: center; animation: a-rebota .9s ease-in-out infinite; }
.calle { position: relative; flex: 1 0 auto; margin: 0 -12px; padding: 44px 16px 12px; background: linear-gradient(transparent 0 18px, #3d4760 18px 22px, #4b566b 22px); display: flex; justify-content: space-between; align-items: flex-end; gap: 10px; font-size: 11.5px; color: #dfe6f3; }
.rueda { position: absolute; top: -10px; width: 50px; height: 50px; border-radius: 50%; background: radial-gradient(#9aa6bf 0 28%, #1c2333 30%); border: 4px solid var(--tinta); }
.rueda.r1 { left: 44px; } .rueda.r2 { right: 44px; }
.calle a { color: var(--amarillo); font-weight: 700; text-decoration: none; }

/* ---------- Juego: marcador de moneda, botones y reloj de arena ---------- */
.barraJ { flex: none; display: grid; grid-template-columns: 1fr auto 1fr; align-items: end; gap: 8px; padding: 30px 12px 10px; }
.etq { position: relative; display: flex; align-items: center; height: 48px; background: var(--azul); border: 3px solid var(--tinta); border-radius: 12px; box-shadow: 0 4px 0 var(--tinta), inset 0 3px 0 rgba(255,255,255,.25); color: #fff; }
.etq b { display: block; font: 700 30px/1 var(--disp); letter-spacing: .03em; font-variant-numeric: tabular-nums; text-shadow: 0 2px 0 rgba(0,0,0,.35); }
.monedas { justify-self: start; margin-left: 12px; padding: 0 12px 0 46px; min-width: 122px; }
.moneda, .arena { position: absolute; top: 50%; width: 54px; height: 54px; margin-top: -27px; border-radius: 50%; border: 3px solid var(--tinta); display: grid; place-items: center; box-shadow: 0 3px 0 var(--tinta); }
.moneda { left: -14px; background: radial-gradient(circle at 35% 30%, #fff3a8, #f2b632 55%, #c98a0c); }
.moneda svg { width: 28px; height: 28px; }
.monedas.pop b { animation: pop .35s; } .monedas.pop .moneda { animation: gira-m .5s ease-out; }
@keyframes pop { 40% { transform: scale(1.4) rotate(-4deg); color: #fff3a8; } }
@keyframes gira-m { 50% { transform: scaleX(.1) translateY(-8px); } }
.estr { display: flex; gap: 2px; font-size: 12px; line-height: 1; margin-top: 1px; }
.estr i { font-style: normal; color: rgba(0,0,0,.4); }
.estr i.ok { color: var(--amarillo); text-shadow: 0 1px 0 var(--tinta); animation: estrella-h .6s cubic-bezier(.3,1.7,.5,1); }
@keyframes estrella-h { from { transform: scale(4) rotate(-90deg); } }
.racha { position: absolute; left: 30px; top: -27px; font: 700 14px/1 var(--disp); letter-spacing: .06em; background: var(--naranja); color: #fff; padding: 4px 8px 2px; border: 2.5px solid var(--tinta); border-radius: 8px; white-space: nowrap; animation: racha .4s cubic-bezier(.3,1.7,.5,1); }
@keyframes racha { from { transform: scale(0) rotate(-20deg); } }
.reloj { justify-self: end; margin-right: 12px; padding: 0 46px 0 12px; min-width: 122px; justify-content: flex-end; text-align: right; }
.arena { right: -14px; background: radial-gradient(circle at 35% 30%, #fff, var(--papel) 60%, #d8c9a8); }
.arena svg { width: 28px; height: 28px; animation: arena 4s ease-in-out infinite; }
@keyframes arena { 0%, 80% { transform: rotate(0); } 100% { transform: rotate(180deg); } }
.tb { height: 6px; width: 64px; border-radius: 3px; background: rgba(0,0,0,.4); overflow: hidden; margin: 2px 0 0 auto; }
.tb i { display: block; height: 100%; background: var(--amarillo); transform-origin: 0 50%; }
.reloj.poco { background: var(--rojo); animation: alarma .5s ease-in-out infinite; }
.reloj.poco .tb i { background: #fff; }
@keyframes alarma { 50% { transform: scale(1.07) rotate(-2deg); } }
.botones { position: relative; display: flex; gap: 6px; align-items: center; padding-bottom: 2px; }
.bt { width: 42px; height: 42px; border-radius: 50%; background: var(--papel); border: 3px solid var(--tinta); box-shadow: 0 3px 0 var(--tinta); color: var(--tinta); font: 700 17px/1 var(--disp); display: grid; place-items: center; transition: transform .08s, box-shadow .08s; }
.bt:active { transform: translateY(3px); box-shadow: 0 0 0 var(--tinta); }
.bt svg { width: 18px; height: 18px; fill: none; stroke: var(--tinta); stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
#nomNivel { position: absolute; left: -30px; right: -30px; top: -19px; text-align: center; font: 700 12px/1 var(--disp); letter-spacing: .12em; color: #9fb0d6; white-space: nowrap; }

#cuerpo { flex: 1; min-height: 0; display: flex; flex-direction: column; }
#pedidos { position: relative; display: flex; gap: 7px; padding: 6px 10px 10px; height: 82px; align-items: stretch; flex: none; }
#pedidos::before { content: ""; position: absolute; left: 4px; right: 4px; top: 3px; height: 6px; border-radius: 3px; background: linear-gradient(#5a6a94, #2c3a63); box-shadow: 0 2px 4px rgba(0,0,0,.4); }
.tk { position: relative; flex: 0 0 calc(25% - 5.25px); min-width: 0; background: var(--papel); border-radius: 4px 4px 10px 10px; padding: 12px 5px 10px; box-shadow: 0 4px 8px rgba(0,0,0,.35);
  transform-origin: 50% 0; animation: cae .5s cubic-bezier(.3,1.5,.5,1); }
.tk::before { content: ""; position: absolute; top: -4px; left: 50%; width: 16px; height: 12px; margin-left: -8px; border-radius: 3px; background: linear-gradient(#e7ecf5, #9aa6bf); box-shadow: 0 1px 2px rgba(0,0,0,.4); }
.tk .tkn { position: absolute; left: 6px; top: 9px; font: 700 8px var(--mono); color: #a6957a; }
.tk .chips { display: flex; gap: 3px; justify-content: center; height: 34px; align-items: center; margin-top: 4px; }
.tk .chips svg { width: 26px; height: 26px; flex: 0 1 26px; min-width: 0; filter: drop-shadow(0 2px 0 rgba(0,0,0,.18)); }
.tk i { position: absolute; left: 6px; right: 6px; bottom: 6px; height: 6px; border-radius: 3px; background: #e6dfcf; overflow: hidden; }
.tk i b { display: block; height: 100%; width: 100%; border-radius: 3px; background: var(--verde); transform-origin: 0 50%; }
.tk.medio i b { background: var(--amar); }
.tk.urge { animation: urge .3s ease-in-out infinite; background: #ffe9e4; }
.tk.urge i b { background: var(--rojo); }
.tk em { position: absolute; inset: 0; display: grid; place-items: center; font: 700 30px var(--mono); font-style: normal; color: #fff; border-radius: inherit; opacity: 0; }
.tk.sale { pointer-events: none; }
.tk.sale em { opacity: 1; }

    tarjeta('<h2 class="titulo">¡Resultados!</h2><div class="pz">' +
      '<svg class="masc" viewBox="-22 -24 44 60">' + gObrero(0, 0, 1, "") + "</svg>" +
      '<div class="niv">Turno ' + (nivelIdx + 1) + " · " + G.def.nombre + "</div>" +
      fila("Despachados", "<b>" + G.entregados + "</b>") + fila("Perdidos", "<b>" + G.perdidos + "</b>") + fila("Mejor racha", "<b>×" + G.rachaMax + "</b>") +
      fila("Puntos", '<b id="cuentaPts">0</b>') + fila("Estrellas", '<span class="est">' + estrellasHtml(n) + "</span>") +
      '<div class="rl nota"><span>Nota</span><u></u><b>' + nota + "</b></div></div>" +
      '<div class="cinta">' + cinta + "</div>" +
      '<div class="acciones">' + botones + '<button class="btn sec" data-acc="menu">Menú</button></div>', "result" + (n === 0 ? " gris" : ""));
    // el marcador sube contando
    const el = $("cuentaPts"), t0 = Date.now();
    const sube = setInterval(function () {
      const k = Math.min(1, (Date.now() - t0) / 900);
      if (!el.isConnected) { clearInterval(sube); return; }
      el.textContent = Math.round(total * suave(k));
      if (k >= 1) clearInterval(sube);
    }, 30);
    if (n >= 1) lluvia(n * 8);
  }

  function lluvia(n) {
    const cols = [C.naranja, C.verde, C.amar, "#3d7df0", "#fff"];
    for (let i = 0; i < n; i++) {
      const c = document.createElement("span"); c.className = "confeti";
      c.style.left = (Math.random() * 100) + "%"; c.style.background = cols[i % cols.length];
      c.style.animationDuration = (2.4 + Math.random() * 2.4) + "s"; c.style.animationDelay = (-Math.random() * 4) + "s";
      $("capa").appendChild(c);
    }
  }

  function premio() {
    const datos = leer();
    if (!todoGanado(datos)) {
      let faltan = 0; for (let i = 0; i < NIVELES.length; i++) if (estrellasDe(datos, i) < 1) faltan++;
      tarjeta('<div class="eti">Premio</div><h2>Todavía no</h2><p>Supera los 5 turnos con al menos una estrella y recibes un premio en el stand de Los chispitas. Te ' +
        (faltan === 1 ? "falta 1 turno" : "faltan " + faltan + " turnos") + '.</p><div class="acciones"><button class="btn" data-acc="cerrar">¡Va!</button></div>');
      return;
    }
    let total = 0, pts = 0;
    for (let i = 0; i < NIVELES.length; i++) { total += estrellasDe(datos, i); pts += datos[NIVELES[i].id].p; }
    const ahora = new Date(), dos = function (x) { return (x < 10 ? "0" : "") + x; };
    const sello = dos(ahora.getDate()) + "/" + dos(ahora.getMonth() + 1) + "/" + ahora.getFullYear() + " · " + dos(ahora.getHours()) + ":" + dos(ahora.getMinutes());
    tarjeta('<h2 class="titulo">¡Premio!</h2><div class="papelC">' +
      '<svg class="trofeo" viewBox="0 0 120 120"><path d="M38 28H22c0 16 6 24 18 26M82 28h16c0 16-6 24-18 26" fill="none" stroke="#0e1a36" stroke-width="11" stroke-linecap="round"/><path d="M38 28H22c0 16 6 24 18 26M82 28h16c0 16-6 24-18 26" fill="none" stroke="#f2b632" stroke-width="6" stroke-linecap="round"/><path d="M38 22h44v26a22 22 0 0 1-44 0z" fill="#f2b632" stroke="#0e1a36" stroke-width="3"/>' +
      '<rect x="54" y="68" width="12" height="16" fill="#d99a12" stroke="#0e1a36" stroke-width="3"/><rect x="38" y="84" width="44" height="12" rx="4" fill="#24396e" stroke="#0e1a36" stroke-width="3"/><path d="M60 30l4.400 9 9.900 1.400-7.200 7 1.700 9.800L60 52.600l-8.800 4.600 1.700-9.800-7.200-7 9.900-1.400z" fill="#fff"/></svg>' +
      '<div class="eti centro">Los 5 turnos superados</div>' +
      '<p class="centro">Ya eres jefe de paquetería. Despachaste todo, hasta en Buen Fin.</p>' +
      '<div class="vale"><b>Vale por 1 premio</b><span>Enseña esta pantalla en el stand de <u>Los chispitas</u> para recibirlo.</span>' +
      "<small>" + total + " de 15 ★ · " + pts + " pts · " + sello + "</small></div></div>" +
      '<div class="acciones"><button class="btn sec" data-acc="menu">Volver al menú</button></div>', "result oro");
    lluvia(30);
    activarAudio(); SON.gana();
  }

  // ---------- eventos ----------
  lienzo.addEventListener("pointerdown", function (ev) {
    ev.preventDefault();
    if (!G || !corriendo) return;
    const r = lienzo.getBoundingClientRect();
    if (!r.width || !r.height) return;
    tocarCelda(Math.floor((ev.clientX - r.left) / r.width * G.W), Math.floor((ev.clientY - r.top) / r.height * G.H));
  });
  lienzo.addEventListener("contextmenu", function (ev) { ev.preventDefault(); });
  $("niveles").addEventListener("click", function (ev) {
    const b = ev.target.closest("[data-nivel]"); if (!b) return;
    const i = +b.dataset.nivel;
    activarAudio(); SON.pasa();
    if (abierto(leer(), i)) prepararNivel(i);
    else tarjeta('<div class="eti">Turno cerrado</div><h2>' + NIVELES[i].nombre + "</h2><p>Primero supera el turno " + i + ": " + NIVELES[i - 1].nombre +
      '.</p><div class="acciones"><button class="btn" data-acc="cerrar">Entendido</button></div>');
  });
  $("bPremio").addEventListener("click", premio);
  $("bIntro").addEventListener("click", abrirIntro);
  $("bJugar").addEventListener("click", function () { activarAudio(); SON.pasa(); prepararNivel(sigNivel); });
  $("iSig").addEventListener("click", function (ev) { ev.stopPropagation(); activarAudio(); SON.pasa(); cerrarIntro(); });
  $("saltar").addEventListener("click", function (ev) { ev.stopPropagation(); cerrarIntro(); });
  $("iVideo").addEventListener("ended", finIntro);
  $("iVideo").addEventListener("error", sinVideo);
  $("intro").addEventListener("click", function () { if (introListo) cerrarIntro(); });
  $("capa").addEventListener("click", function (ev) {
    const b = ev.target.closest("[data-acc]"); if (!b) return;
    const acc = b.dataset.acc;
    if (acc === "empezar" || acc === "seguir") arrancar();
    else if (acc === "reiniciar") prepararNivel(nivelIdx);
    else if (acc === "siguiente") prepararNivel(Math.min(nivelIdx + 1, NIVELES.length - 1));
    else if (acc === "premio") { G = null; pintarMenu(); mostrar("menu"); premio(); }
    else if (acc === "menu") irMenu();
    else if (acc === "cerrar") cerrarTarjeta();
  });
  $("bPausa").addEventListener("click", pausar);
  function alternarSonido() {
    mudo = !mudo; const d = leer(); d.mudo = mudo; guardar(d); pintarSonido();
    $("bSonM").textContent = mudo ? "Sin sonido" : "Sonido";
    if (!mudo) { activarAudio(); SON.toma(); }
  }
  $("bSon").addEventListener("click", alternarSonido);
  $("bSonM").addEventListener("click", alternarSonido);
  document.addEventListener("visibilitychange", function () {
    if (document.hidden) { pausar(); return; }
    const v = $("iVideo");      // al volver a la pestaña, la intro sigue donde iba
    if (!$("intro").hidden && !introListo && v.paused && v.getAttribute("src")) { const p = v.play(); if (p && p.catch) p.catch(sinVideo); }
  });
  window.addEventListener("pagehide", pausar);
  window.addEventListener("resize", function () { ajustar(); dibujar(); });
  window.addEventListener("orientationchange", function () { setTimeout(function () { ajustar(); dibujar(); }, 250); });
  document.addEventListener("gesturestart", function (ev) { ev.preventDefault(); });
  document.addEventListener("dblclick", function (ev) { ev.preventDefault(); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function () { dibujar(); });

  // Acceso para pruebas automáticas
  window.__juego = { get G() { return G; }, tocar: tocarCelda, NIVELES: NIVELES };

  $("pistaIco").outerHTML = ICONO_PISTA;
  pintarSonido(); pintarMenu(); mostrar("menu");
  if (!leer().intro) abrirIntro();
})();
</script>
</body>
</html>
